name: tombox
description: "Tombox: app offline de conferência de inventário patrimonial"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  uuid: ^4.6.0
  crypto: ^3.0.8
  intl: ^0.20.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.3.0
  csv: ^8.0.0
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_commons: ^0.13.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  shelf: ^1.4.3
  archive: ^4.5.2
  qr_flutter: ^4.1.0
  flutter_image_compress: ^2.5.1
  nsd: ^5.0.1
  pdf: ^3.13.1
  signature: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:

  uses-material-design: true

  assets:
    - assets/brand/
    - assets/brand/presets/
    - assets/demo/
    - assets/fonts/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
